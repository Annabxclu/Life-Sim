*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);font-size:15px;transition:background .2s}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px 4px}
.topline{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.topline .loc{color:var(--mut);font-weight:700;font-size:12px}
.money{color:var(--acc);font-size:17px;font-weight:900}
.money.neg{color:var(--bad)}
.card{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 1px 0 var(--line),0 3px 12px var(--shadow);margin:8px 0}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 10px}
.need{font-size:11px;font-weight:700;color:var(--mut)}
.need span{float:right}
.bar{height:7px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;border-radius:9px;transition:width .3s}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.av{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;background:var(--card);border:2px solid transparent;border-radius:14px;padding:5px 8px;min-width:60px;cursor:pointer;color:var(--ink)}
.av.on{border-color:var(--acc);background:var(--acc2)}
.av .e{font-size:26px;line-height:1.1}
.actbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
main{padding:0 12px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:7px 0 9px;font:inherit;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:21px}
nav button.on{color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{font-size:22px;width:32px;text-align:center;flex:0 0 auto}
.row .tx{flex:1;min-width:0;font-weight:700}
.row .sub{font-size:12px;color:var(--mut);font-weight:600;white-space:pre-line;line-height:1.45}
.row .rt{font-size:13px;color:var(--mut);font-weight:800;white-space:nowrap}
.row.dis{opacity:.42;cursor:default}
.sec{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 4px 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc2i)}
.btn.gray{background:var(--gray);color:var(--ink)}
.btn.red{background:var(--pr);color:var(--pri)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
h1{font-size:24px;margin:16px 4px 4px;font-weight:900}
h2{font-size:18px;margin:6px 0;font-weight:900}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{background:var(--card);border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.room .rn{font-weight:900}
.room .ri{font-size:20px;letter-spacing:2px;margin-top:6px;min-height:26px;word-break:break-all}
.room .who{font-size:12px;color:var(--mut);font-weight:700}
.pill{display:inline-block;background:var(--acc2);color:var(--acc2i);font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;margin:2px 4px 2px 0}
.pill.o{background:var(--po);color:var(--poi)}
.pill.r{background:var(--pr);color:var(--pri)}
.pill.b{background:var(--pb);color:var(--pbi)}
input,select{font:inherit;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#sheetWrap{position:fixed;inset:0;background:var(--shade);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;padding:12px 12px 6px;gap:8px;font-weight:900;font-size:17px}
.sh-h .t{flex:1;text-align:center}
.sh-h button{border:0;background:var(--card);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.sh-b{overflow:auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(300%);background:var(--toast);color:var(--toasti);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:92%;transition:transform .25s;white-space:pre-line;text-align:center}
#toast{opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.skills{display:flex;flex-wrap:wrap;gap:4px}
.big{font-size:44px;text-align:center}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.speeds{display:flex;background:var(--card);border-radius:12px;overflow:hidden;margin-top:6px;box-shadow:0 1px 0 var(--line)}
.speeds button{flex:1;border:0;background:none;padding:7px 0;font:inherit;font-size:12px;font-weight:800;color:var(--mut);cursor:pointer}
.speeds button.on{background:var(--acc);color:#fff}
.busy{background:var(--busy);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc2i)}
.logline{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.logline b{color:var(--mut);font-size:11px;display:block}

</style>

/* ============ state ============ */
let state=null,tab='home',sheetStack=[],draft=null;
const SAVE_KEY='lifesim_v1';
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
const dayNum=()=>Math.floor(state.time/1440)+1;
const dowOf=d=>(d-1)%7;
const hour=()=>Math.floor((state.time%1440)/60);
function clock(){const m=state.time%1440,h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`}
const active=()=>state.family.find(s=>s.id===state.activeId)||state.family[0];
const stg=s=>stageIdx(s.age);

function newSim(name,g,age,role){return{id:'s'+uid(),name,g,age,role,needs:{hunger:80,energy:85,hygiene:80,bladder:75,fun:70,social:65},skills:Object.fromEntries(SKILLS.map(([k])=>[k,0])),job:null,lastWorked:0,lastSchool:0,grade:70,rels:{},partnerId:null,married:false,loc:{type:'home'}}}
function makeHouse(def,extra){return Object.assign({n:def.n,rooms:def.rooms.map(([type,name,items])=>({id:'r'+uid(),type,name,items:items.map(i=>({uid:uid(),id:i}))}))},extra||{})}
function allNpcs(){return Object.values(state.worlds).flatMap(w=>w.fams.flatMap(f=>f.members))}
function findPerson(id){return state.family.find(s=>s.id===id)||allNpcs().find(n=>n.id===id)}
function isNpc(id){return id&&id[0]==='n'}
function famOf(n){return state.worlds[n.wid].fams.find(f=>f.id===n.fid)}
function log(m){state.log.unshift({t:`Day ${dayNum()} · ${DAYS[dowOf(dayNum())]} ${clock()}`,m});state.log.length=Math.min(state.log.length,80)}

/* ============ house helpers ============ */
function house(){if(state.home&&state.world===state.homeWorld)return state.home;if(state.hotel&&state.hotel.wid===state.world)return state.hotel;return null}
const isHotel=()=>house()&&house()===state.hotel;
const atHouse=s=>s.loc.type==='home'&&!!house();
function itemsOfType(t){const h=house();if(!h)return[];return h.rooms.flatMap(r=>r.items.filter(it=>ITEMS[it.id].type===t&&!it.broken))}
const hasType=t=>itemsOfType(t).length>0;
const bestTier=t=>Math.max(0,...itemsOfType(t).map(it=>ITEMS[it.id].tier));
const famHome=()=>state.family.filter(atHouse);
const homeValue=()=>state.home&&!state.home.rent?HOMES[state.home.id].p:0;
const itemsValue=()=>state.home?state.home.rooms.reduce((a,r)=>a+r.items.reduce((b,it)=>b+ITEMS[it.id].p,0),0):0;

/* ============ time ============ */

function canRomance(a,b){if(stg(a)<4||stg(b)<4)return false;if(isNpc(b.id))return true;const ok=['Head','Partner','Roommate'];return ok.includes(a.role)&&ok.includes(b.role)}

 if(isNpc(pid)&&stg(a)>=4&&stg(p)>=4&&state.family.length<8)out.push({icon:'🏡',label:'Ask to move in (roommate)',sub:r.f>=70?'They might say yes!':'Need Friendship 70+',disabled:r.f<70||isHotel(),onClick:()=>{if(a.busy){busyToast(a);return}startBusy(a,`Asking ${p.name} to move in`,'🏡',15,null,()=>{if(Math.random()<.75){moveIn(p,'Roommate');return `🏡 ${p.name} moved in as a roommate!`}r.f-=5;return `${p.name} isn't ready to move in`});closeSheet();save();render()}});
 return out}}
function talkEntry(pid,cat,[n,fd,minF,rd,minR,special]){const a=active(),p=findPerson(pid),r=rel(a,pid);const c=TALK[cat];
 const risky=r.f<minF||(minR&&r.r<minR);
 return{icon:c.i,label:n,sub:c.mean?'Lowers friendship':risky?'⚠️ Risky — they might not like it':'Should go well',onClick:()=>doTalk(pid,cat,n,fd,minF,rd||0,minR||0,special)}}
function doTalk(pid,cat,n,fd,minF,rd,minR,special){const a=active(),p=findPerson(pid),r=rel(a,pid);if(a.busy){enqueue(a,`${n} (${p.name})`,'💬',()=>doTalk(pid,cat,n,fd,minF,rd,minR,special));closeSheet();return}startBusy(a,`Talking to ${p.name}`,'💬',15,null,()=>{
 const tmod=talkMod(p,a,cat,rd);let chance=.78+(r.f-Math.max(minF,0))/150+a.skills.charisma*.02+tmod;if(minR)chance+=(r.r-minR)/120;chance=clamp(chance,.2,.97);
 const ok=TALK[cat].mean||Math.random()<chance;let msg;
 if(ok){r.f=clamp(r.f+fd*(1+a.skills.charisma/25)*(fd>0&&hasTrait(a,'Friendly')?1.25:1),-100,100);r.r=clamp(r.r+rd,0,100);applyNeeds(a,{social:TALK[cat].mean?4:12,fun:3});addSkill(a,'charisma',.12);
  msg=TALK[cat].mean?`${a.name} chose to ${n.toLowerCase()} with ${p.name} 😤`:`${a.name}: "${n}" — ${p.name} loved it! 😊`;
  if(special==='partner'){if(p.partnerId&&p.partnerId!==a.id){const o=findPerson(p.partnerId);if(o&&o.partnerId===p.id){o.partnerId=null;o.married=false}}a.partnerId=pid;p.partnerId=a.id;msg=`❤️ ${p.name} said yes! They're now partners`}
  if(special==='propose'){if(isNpc(pid)){a.partnerId=pid;a.married=true;moveIn(p,'Partner',a);msg=`💍 ${p.name} said YES! They got married and moved in!`}else{a.partnerId=pid;p.partnerId=a.id;a.married=p.married=true;msg=`💍 ${p.name} said YES! They're married!`}}
 }else{r.f=clamp(r.f-5,-100,100);if(rd)r.r=clamp(r.r-4,0,100);applyNeeds(a,{social:3});msg=`${a.name}: "${n}" — ${p.name} wasn't into it 😬`}
 if(!isNpc(pid)&&state.family.includes(p)){const r2=rel(p,a.id);r2.f=r.f;r2.r=r.r;applyNeeds(p,{social:8})}
 return msg});closeSheet();toast(`💬 ${a.name} is talking to ${p.name}…`);save();render()}
function moveIn(npc,role,partner){if(npc.partnerId&&isNpc(npc.partnerId)){const o=findPerson(npc.partnerId);if(o&&o.partnerId===npc.id){o.partnerId=null;o.married=false}}leaveFam(npc);

 if(partner){partner.partnerId=s.id;s.partnerId=partner.id;s.married=partner.married=true}
 s.loc={type:'home'};state.family.push(s);if(!partner)toast(`🏡 ${s.name} moved in as a roommate!`);log(`${s.name} moved in`)}

/* ============ map / places ============ */
function venueOpen(id,h=hour()){const[o,c]=VENUES[id].open;const hh=(h<o&&c>24)?h+24:h;return hh>=o&&hh<c}
function goTo(loc,label){const s=active();if(stg(s)<=1){toast('Babies & toddlers need an adult to take them places');return}if(s.busy){enqueue(s,`Go to ${label}`,'🚶',()=>goTo(loc,label));closeSheet();return}startBusy(s,`Heading to ${label}`,tripIcon(s),tripMins(s),null,(dv=>x=>{const a=dv?driveRisk(x):'';if(a==='dead')return null;x.loc=loc;return `📍 ${x.name} arrived at ${label}`+a})(canDriveS(s)));closeSheet();tab='home';save();render();window.scrollTo(0,0)}
function goHome(){const s=active();if(s.busy){enqueue(s,'Go home','🏠',()=>goHome());closeSheet();return}startBusy(s,'Heading home',tripIcon(s),tripMins(s),null,x=>{x.loc={type:'home'};return `🏠 ${x.name} got home`});closeSheet();tab='home';save();render()}
function knock(fid){const s=active();const f=state.worlds[state.world].fams.find(x=>x.id===fid);if(s.busy){enqueue(s,`Visit the ${f.last}s`,'🚪',()=>knock(fid));closeSheet();return}
 startBusy(s,`Heading to the ${f.last} house`,'🚪',tripMins(s),null,x=>{const home=f.members.filter(m=>npcStatus(m)==='home');
  if(!home.length)return `🚪 No one answered at the ${f.last} house — nobody's home`;
  const best=Math.max(...home.map(m=>rel(x,m.id).f));const h=hour();let ch=best>=40?.95:best>=15?.7:.3;if(h>=22||h<8)ch*=.25;
  if(Math.random()<ch){x.loc={type:'visit',fid};home.forEach(m=>{const r=rel(x,m.id);r.f=clamp(r.f+3,-100,100)});return `${home[0].name} ${home[0].last} welcomed ${x.name} inside 🏡`}
  const why=best<15?"they don't really know you":(h>=22||h<8)?"it's too late for visitors":"they're busy right now";return `🚪 The ${f.last}s turned ${x.name} away — ${why}`});
 closeSheet();tab='home';save();render()}

/* ============ travel ============ */
function routeCost(a,b){const c=Math.max(WORLDS[a].travel,WORLDS[b].travel);return canDrive()?Math.round(c/2):c}
function travelTo(wid,hid){const n=state.family.length;const cost=routeCost(state.world,wid)*n+(hid?HOTELS[hid].night:0);
 if(state.money<cost){toast('Not enough money for this trip 💸');return}
 closeSheet();state.money-=cost;state.family.forEach(x=>{x.busy=null;delete BUSYFN[x.id]});advance(180);state.world=wid;
 state.hotel=hid?makeHouse(HOTELS[hid],{wid,hid}):null;state.family.forEach(s=>s.loc={type:'home'});tab='home';
 const m=hid?`✈️ The family arrived in ${WORLDS[wid].n} and checked into ${HOTELS[hid].n}!`:`🏠 Back home in ${WORLDS[wid].n}`;log(m);toast(m);save();render();window.scrollTo(0,0)}
function goHomeWorld(free){if(!free){travelTo(state.homeWorld,null);return}state.world=state.homeWorld;state.hotel=null;state.family.forEach(s=>s.loc={type:'home'})}

const SPEEDS=[0,1,2,4,10,30];
let lastTick=performance.now(),acc=0,prevSpeed=1,needRender=false;
const BUSYFN={};
function startBusy(s,label,icon,mins,needs,done,opts={}){mins=Math.max(1,Math.round(mins));
 s.busy={label,icon,mins,start:state.time,end:state.time+mins,needs:needs||null,away:opts.away||null,prevLoc:opts.away?s.loc:null};
 if(opts.away)s.loc={type:'away',label:opts.away};BUSYFN[s.id]=done;return true}
function tickBusy(step){state.family.forEach(s=>{const b=s.busy;if(!b)return;if(b.needs)for(const k in b.needs)s.needs[k]=clamp(s.needs[k]+b.needs[k]*step/b.mins,0,100);if(state.time>=b.end)finishBusy(s)})}
function finishBusy(s){const b=s.busy;s.busy=null;if(b.away&&b.prevLoc)s.loc=b.prevLoc;const fn=BUSYFN[s.id];delete BUSYFN[s.id];
 let msg;try{msg=fn?fn(s):`${s.name} finished: ${b.label}`}catch(e){console.error(e);msg=`${s.name} finished: ${b.label}`}
 if(msg){log(msg);toast(msg+warnText(s))}needRender=true;save();runNext(s)}
function busyToast(s){toast(`${s.name} is busy (${s.busy.label}). Wait, skip, or cancel first.`)}
function skipBusy(s){const b=s.busy;if(!b)return;advance(b.end-state.time);if(s.busy===b)finishBusy(s);save();render()}
function cancelBusy(s){const b=s.busy;if(!b)return;s.busy=null;delete BUSYFN[s.id];if(b.away&&b.prevLoc)s.loc=b.prevLoc;toast(`${s.name} stopped: ${b.label}`);runNext(s);save();render()}
function setSpeed(v){if(!state)return;if(v===0&&state.speed>0)prevSpeed=state.speed;state.speed=v;save();updateHeader()}
setInterval(()=>{const now=performance.now();const dt=Math.min(1000,now-lastTick);lastTick=now;
 if(!state||!state.home||state.gameOver||!state.speed||document.hidden)return;
 acc+=dt/1000*state.speed;const m=Math.floor(acc);if(m<=0)return;acc-=m;const h0=Math.floor(state.time/60);
 try{advance(m)}catch(e){console.error(e);setSpeed(0);toast('Simulation error: '+e.message);return}
 if(needRender||Math.floor(state.time/60)!==h0){needRender=false;render();if(sheetStack.length&&!document.querySelector('#shBody input'))refreshSheet()}else updateHeader()},100);
setInterval(()=>{if(state&&state.home)save()},15000);
document.addEventListener('visibilitychange',()=>{if(!state)return;if(document.hidden)save();else lastTick=performance.now()});
document.addEventListener('keydown',e=>{if(!state||!state.home||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key===' '){e.preventDefault();setSpeed(state.speed?0:prevSpeed||1)}if(e.key>='1'&&e.key<='5')setSpeed(SPEEDS[+e.key])});

function howTo(){return[el('div',{class:'card',html:`<p><b>Needs</b> drop over time. Keep them up by doing things — tap <b>▶ Actions</b> or your character's picture for a list sorted by room.</p><p><b>Time</b> runs on its own, like Prison Authority: at 1x, 1 real second = 1 in-game minute. Use ❚❚ to pause and 2x–30x to speed up (keyboard: Space, 1–5). Actions take time to finish. Your character shows a progress bar, and you can ⏩ skip to the end or ✕ cancel. Each family member can be busy with their own thing at the same time.</p><p><b>Rooms</b>: tap a room on the Home tab to use what's in it, or rename it (e.g. "Mia's Room").</p><p><b>Build mode</b>: buy furniture & upgrades (⭐⭐⭐ = better), place them in any room, sell old stuff for half price, or build new rooms.</p><p><b>Work</b>: get a job in the Family tab. Go to work during the shift window. Good mood + skills = promotions. Skipping work hurts performance.</p><p><b>Map</b>: visit places, meet people, tap someone to talk. Knock on neighbors' doors — strangers may turn you away, and nobody answers if they're out.</p><p><b>Romance</b>: adults can flirt, become partners, propose (they move in!) and try for a baby in a bed.</p><p><b>Ages</b>: everyone has a birthday every 7 days. Babies need an adult to feed, bathe and put them to bed in a crib.</p><p><b>Vacations</b>: travel from the More tab, check into a hotel, buy souvenirs for your inventory.</p><p><b>Pets</b>: buy a pet bed (Build → Pets), then adopt a dog, cat, bunny, hamster or parrot at the pet shelter on the Map. Pets have needs: feed, cuddle, bathe and play with them, walk your dog, teach tricks, and buy toys. A neglected pet gets taken back to the shelter. While you travel, a pet sitter looks after them for $15 a night.</p><p><b>Town life</b>: neighbors date, marry, move in together, have babies and move out on their own. Newcomers move into empty houses and apartments, townies wander around, and tourists visit for a few days. Check 📰 Town news on the Map. Tap a household to see how everyone is related and where they work.</p><p><b>Homes</b>: buy a house, or rent an apartment (deposit up front, rent added to Monday bills).</p><p><b>Health</b>: sims can catch colds and the flu, get food poisoning or sprain an ankle. Rest, take medicine, or visit the clinic. Flu shots and vitamins help. You can call in sick.</p><p><b>Breakdowns</b>: appliances sometimes break. Fix them yourself (Handiness) or call a repair person.</p><p><b>Cars</b>: get a learner's permit and driver's license at the DMV, then buy a car at Sunny Side Motors. Drivers get around town in 8 minutes instead of 20, and trips to other worlds are half price.</p><p><b>Shopping</b>: the mall sells furniture, electronics, outfits, skill books, medicine, gifts and more. Usable items go in your 🎒 Backpack.</p><p><b>Skills</b>: Cooking, Fitness, Charisma, Logic, Creativity, Music, Gardening, Handiness, Driving and Wellness.</p><p><b>Traits</b>: each sim has up to 3 personality traits that change how fast needs drop, how quickly skills grow and how conversations go. Edit them in Family → More → Traits.</p><p><b>Queue</b>: pick more actions while someone is busy and they line up (up to 6). Tap a queued task to remove it.</p><p><b>Leftovers</b>: cook extra to save servings in the fridge. They last 3 days, and the family eats them when hungry.</p><p><b>University</b>: young adults and up can enroll at a university, attend lectures and study at home. Graduates start matching careers one level higher with +15% pay.</p><p><b>Death</b>: sims can die of old age, flu complications, starvation or rare car accidents. You can turn deaths off in More.</p><p><b>Bills</b> are due every Monday.</p>`})]}
