<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Sim</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#2b2a33;--mut:#7d7889;--acc:#2fb36b;--acc2:#e3f6ea;--warn:#e9a23b;--bad:#e05757;--line:#ece5d8;--blue:#4b7bec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 12px 4px}
.topline{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.topline .loc{color:var(--mut);font-weight:700;font-size:12px}
.money{color:var(--acc);font-size:17px;font-weight:900}
.money.neg{color:var(--bad)}
.card{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 1px 0 var(--line),0 3px 12px rgba(60,40,10,.04);margin:8px 0}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 10px}
.need{font-size:11px;font-weight:700;color:var(--mut)}
.need span{float:right}
.bar{height:7px;background:#efe9de;border-radius:9px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;border-radius:9px;transition:width .3s}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.av{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;background:#fff;border:2px solid transparent;border-radius:14px;padding:5px 8px;min-width:60px;cursor:pointer}
.av.on{border-color:var(--acc);background:var(--acc2)}
.av .e{font-size:26px;line-height:1.1}
.actbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
main{padding:0 12px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:7px 0 9px;font:inherit;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:21px}
nav button.on{color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{font-size:22px;width:32px;text-align:center;flex:0 0 auto}
.row .tx{flex:1;min-width:0;font-weight:700}
.row .sub{font-size:12px;color:var(--mut);font-weight:600}
.row .rt{font-size:13px;color:var(--mut);font-weight:800;white-space:nowrap}
.row.dis{opacity:.42;cursor:default}
.sec{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 4px 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:var(--acc2);color:#1f7a49}
.btn.gray{background:#ece7de;color:var(--ink)}
.btn.red{background:#fde6e6;color:#b23a3a}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
h1{font-size:24px;margin:16px 4px 4px;font-weight:900}
h2{font-size:18px;margin:6px 0;font-weight:900}
.mut{color:var(--mut);font-size:13px;font-weight:600}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{background:#fff;border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.room .rn{font-weight:900}
.room .ri{font-size:20px;letter-spacing:2px;margin-top:6px;min-height:26px;word-break:break-all}
.room .who{font-size:12px;color:var(--mut);font-weight:700}
.pill{display:inline-block;background:var(--acc2);color:#1f7a49;font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;margin:2px 4px 2px 0}
.pill.o{background:#fff1dc;color:#a76b10}
.pill.r{background:#fde6e6;color:#b23a3a}
.pill.b{background:#e6edfd;color:#3756a8}
input,select{font:inherit;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#sheetWrap{position:fixed;inset:0;background:rgba(30,25,40,.38);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;padding:12px 12px 6px;gap:8px;font-weight:900;font-size:17px}
.sh-h .t{flex:1;text-align:center}
.sh-h button{border:0;background:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.sh-b{overflow:auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%) translateY(-120%);background:#2b2a33;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:92%;transition:transform .25s;white-space:pre-line;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.skills{display:flex;flex-wrap:wrap;gap:4px}
.big{font-size:44px;text-align:center}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logline{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.logline b{color:var(--mut);font-size:11px;display:block}
</style>
</head>

/* ============ state ============ */
let state=null,tab='home',sheetStack=[],draft=null;
const SAVE_KEY='lifesim_v1';
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
const dayNum=()=>Math.floor(state.time/1440)+1;
const dowOf=d=>(d-1)%7;
const hour=()=>Math.floor((state.time%1440)/60);
function clock(){const m=state.time%1440,h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`}
const active=()=>state.family.find(s=>s.id===state.activeId)||state.family[0];
const stg=s=>stageIdx(s.age);

function newSim(name,g,age,role){return{id:'s'+uid(),name,g,age,role,needs:{hunger:80,energy:85,hygiene:80,bladder:75,fun:70,social:65},skills:{cooking:0,fitness:0,charisma:0,logic:0,creativity:0},job:null,lastWorked:0,lastSchool:0,grade:70,rels:{},partnerId:null,married:false,loc:{type:'home'}}}
function mkNpc(wid,fid,last,age,g){return{id:'n'+uid(),wid,fid,name:g==='f'?R(FN_F):R(FN_M),last,age,g,works:age>=18&&age<62&&Math.random()<.7,trait:R(Object.keys(TRAITS))}}
function genWorld(wid,usedLast){const W=WORLDS[wid];const fams=[];const n=W.res?7:4;
 for(let i=0;i<n;i++){let last,tries=0;do{last=R(LAST);tries++}while(usedLast.has(last)&&tries<50);usedLast.add(last);
  const fid='f'+uid(),m=[],g1=R(['f','m']),a1=20+Math.floor(Math.random()*50);m.push(mkNpc(wid,fid,last,a1,g1));
  const couple=Math.random()<.55;if(couple)m.push(mkNpc(wid,fid,last,clamp(a1+Math.floor(Math.random()*9)-4,19,85),g1==='f'?'m':'f'));
  if(a1<50){const k=Math.floor(Math.random()*(couple?3:2));for(let j=0;j<k;j++)m.push(mkNpc(wid,fid,last,1+Math.floor(Math.random()*16),R(['f','m'])))}
  fams.push({id:fid,last,addr:`${12+i*9} ${W.streets[i%W.streets.length]}`,icon:R(['🏠','🏡','🏘️','🛖']),members:m})}
 return{fams}}
function makeHouse(def,extra){return Object.assign({n:def.n,rooms:def.rooms.map(([type,name,items])=>({id:'r'+uid(),type,name,items:items.map(i=>({uid:uid(),id:i}))}))},extra||{})}
function allNpcs(){return Object.values(state.worlds).flatMap(w=>w.fams.flatMap(f=>f.members))}
function findPerson(id){return state.family.find(s=>s.id===id)||allNpcs().find(n=>n.id===id)}
function isNpc(id){return id&&id[0]==='n'}
function famOf(n){return state.worlds[n.wid].fams.find(f=>f.id===n.fid)}
function log(m){state.log.unshift({t:`Day ${dayNum()} · ${DAYS[dowOf(dayNum())]} ${clock()}`,m});state.log.length=Math.min(state.log.length,80)}

/* ============ house helpers ============ */
function house(){if(state.home&&state.world===state.homeWorld)return state.home;if(state.hotel&&state.hotel.wid===state.world)return state.hotel;return null}
const isHotel=()=>house()&&house()===state.hotel;
const atHouse=s=>s.loc.type==='home'&&!!house();
function itemsOfType(t){const h=house();if(!h)return[];return h.rooms.flatMap(r=>r.items.filter(it=>ITEMS[it.id].type===t))}
const hasType=t=>itemsOfType(t).length>0;
const bestTier=t=>Math.max(0,...itemsOfType(t).map(it=>ITEMS[it.id].tier));
const famHome=()=>state.family.filter(atHouse);
const homeValue=()=>state.home?HOMES[state.home.id].p:0;
const itemsValue=()=>state.home?state.home.rooms.reduce((a,r)=>a+r.items.reduce((b,it)=>b+ITEMS[it.id].p,0),0):0;

/* ============ time ============ */
function advance(mins){let rem=mins;while(rem>0){const step=Math.min(rem,60-(state.time%60));const pd=dayNum();state.time+=step;rem-=step;decayAll(step);if(state.time%60===0)onHour();if(dayNum()!==pd)onNewDay(pd)}}
function decayAll(step){const a=active();state.family.forEach(s=>{const st=stg(s);const mult=st<=1?.75:1;for(const k in DECAY){let r=DECAY[k]*mult;if(st===0&&k==='hunger')r=7;s.needs[k]=clamp(s.needs[k]-r*step/60,0,100)}if(s!==a&&st>=2&&atHouse(s))autonomy(s)});if(state.pets)petDecay(step)}
function autonomy(s){const n=s.needs;
 if(n.hunger<30&&(hasType('fridge')||hasType('stove'))&&state.money>=5){n.hunger=75;state.money-=5}
 if(n.energy<25&&(hasType('bed')||hasType('couch')))n.energy=80;
 if(n.hygiene<30&&(hasType('shower')||hasType('tub')))n.hygiene=85;
 if(n.bladder<30&&hasType('toilet'))n.bladder=100;
 if(n.fun<30&&['tv','computer','stereo','toybox','bookshelf','guitar','easel'].some(hasType))n.fun=70;
 if(n.social<30&&famHome().length>1)n.social=65}
function onHour(){const h=hour(),d=dayNum(),dw=dowOf(d),a=active();
 state.family.forEach(s=>{const st=stg(s);
  if(s.job){const j=jobById(s.job.id);if(j.days.includes(dw)&&s.lastWorked!==d){
    if(s!==a&&h===j.start&&atHouse(s)){s.lastWorked=d;const pay=j.lv[s.job.level][1]*j.hours;state.money+=pay;s.job.perf=clamp(s.job.perf+10,-50,100);s.needs.energy=clamp(s.needs.energy-25,0,100);s.needs.social=clamp(s.needs.social+10,0,100);log(`${s.name} went to work and earned ${fmt$(pay)}`);checkPromo(s)}
    if(s===a&&h===j.start-1)toast(`⏰ ${s.name} has work at ${fmtH(j.start)}!`)}}
  if((st===2||st===3)&&dw<5&&s.lastSchool!==d){
    if(s!==a&&h===8&&atHouse(s)){s.lastSchool=d;s.grade=clamp(s.grade+4,0,100);s.skills.logic=Math.min(10,s.skills.logic+.3);s.needs.social=clamp(s.needs.social+20,0,100);log(`${s.name} went to school`)}
    if(s===a&&h===7)toast(`🎒 School starts at 8 AM for ${s.name}!`)}})}
function onNewDay(pd){const pdw=dowOf(pd),nd=dayNum();
 state.family.forEach(s=>{

function stageOk(d,s){const st=stg(s);return st>=(d.min??2)&&st<=(d.max??6)}
function needSummary(d){const p=[];if(d.needs)for(const k in d.needs){const v=d.needs[k];if(v>0){const N=NEEDS.find(x=>x[0]===k);p.push(`+${v>=100?'max':v} ${N[1]}`)}}if(d.skills)for(const k in d.skills){p.push(SKILLS.find(x=>x[0]===k)[1]+'↑')}if(d.mins)p.push(d.mins>=60?`${+(d.mins/60).toFixed(1)}h`:`${d.mins}m`);return p.join(' · ')}
function defEntry(d){const s=active();const okS=stageOk(d,s);const okR=!d.req||d.req();let sub=d.sub||needSummary(d);if(!okS)sub=stg(s)<(d.min??2)?`Too young for this`:`Not for ${stageName(s.age)}s`;else if(!okR)sub=d.why||'Not available';
 return{icon:d.i||'▫️',label:d.n,sub,right:d.cost?fmt$(d.cost):(d.menu?'›':''),disabled:!okS||!okR,onClick:()=>d.menu?pushMenu(d.n,d.menu):doAct(d)}}
function applyNeeds(s,n){if(n)for(const k in n)s.needs[k]=clamp(s.needs[k]+n[k],0,100)}
function addSkill(s,k,v){s.skills[k]=Math.min(10,s.skills[k]+v*(1-s.skills[k]/16))}
function doAct(d){const s=active();
 if(d.cost&&state.money<d.cost){toast('Not enough money 💸');return}
 if(d.cost)state.money-=d.cost;closeSheet();
 const before=SKILLS.map(([k])=>Math.floor(s.skills[k]));
 advance(d.mins||30);applyNeeds(s,d.needs);if(d.skills)for(const k in d.skills)addSkill(s,k,d.skills[k]);
 let msg=d.msg?`${s.name} ${d.msg}`:`${s.name}: ${d.n}`;
 if(d.after){const m=d.after(s);if(m)msg=m}
 const ups=SKILLS.filter(([k],i)=>Math.floor(s.skills[k])>before[i]).map(([k,i,n])=>`${i} ${n} level ${Math.floor(s.skills[k])}!`);
 if(ups.length)msg+='\n⭐ '+ups.join(', ');
 log(msg);toast(msg+warnText(s));save();render()}
function warnText(s){const low=NEEDS.filter(([k])=>s.needs[k]<15).map(([k,i,n])=>`${i} ${n}`);return low.length?`\n⚠️ Low: ${low.join(', ')}`:''}

function workEntry(s){const st=stg(s),d=dayNum(),dw=dowOf(d),h=hour();const out=[];
 if(s.job){const j=jobById(s.job.id),L=j.lv[s.job.level];const workday=j.days.includes(dw);const can=workday&&s.lastWorked!==d&&h>=j.start-1&&h<=j.start+2;
  out.push({icon:j.i,label:`Go to work (${L[0]})`,sub:s.lastWorked===d?'Already worked today ✅':!workday?`Day off — works ${j.days.map(x=>DAYS[x]).join(', ')}`:can?`${j.hours}h shift · ${fmt$(L[1]*j.hours)}`:`Shift starts ${fmtH(j.start)} (go ${fmtH(j.start-1)}–${fmtH(j.start+2)})`,disabled:!can,onClick:()=>goWork(s)})}
 if((st===2||st===3)){const can=dw<5&&s.lastSchool!==d&&h>=7&&h<=9;out.push({icon:'🎒',label:'Go to school',sub:s.lastSchool===d?'Already went today ✅':dw>=5?'No school on weekends 🎉':can?'8 AM – 3 PM':'School runs 8 AM – 3 PM (leave 7–9 AM)',disabled:!can,onClick:()=>goSchool(s)})}
 return out}
function goWork(s){const j=jobById(s.job.id),L=j.lv[s.job.level];closeSheet();const late=hour()>j.start;const mood=avgMood(s);
 if(late)advance(j.hours*60);else{advance((j.start-hour())*60-(state.time%60));advance(j.hours*60)}
 s.lastWorked=dayNum();const pay=L[1]*j.hours;state.money+=pay;applyNeeds(s,{energy:-30,fun:-18,social:10,hygiene:-10});addSkill(s,j.skill,.4);
 const gain=Math.round(12+mood/10-(late?8:0));s.job.perf=clamp(s.job.perf+gain,-50,100);
 let msg=`${s.name} worked as a ${L[0]} and earned ${fmt$(pay)}${late?' (arrived late 😬)':''}`;const p=checkPromo(s);if(p)msg+='\n'+p;
 log(msg);toast(msg+warnText(s));save();render()}
function checkPromo(s){const j=jobById(s.job.id);if(s.job.perf>=100&&s.job.level<j.lv.length-1){const need=(s.job.level+1)*2;if(s.skills[j.skill]>=need){s.job.level++;s.job.perf=20;const m=`🎉 ${s.name} got promoted to ${j.lv[s.job.level][0]}!`;log(m);toast(m);return m}return `Needs ${SKILLS.find(x=>x[0]===j.skill)[2]} level ${need} for promotion`}return ''}
function goSchool(s){closeSheet();const h=hour();if(h<8)advance((8-h)*60-(state.time%60));advance(7*60);s.lastSchool=dayNum();s.grade=clamp(s.grade+6,0,100);addSkill(s,'logic',.5);applyNeeds(s,{social:25,fun:-5,energy:-15});const m=`${s.name} went to school 🎒 (grade ${gradeLetter(s.grade)})`;log(m);toast(m+warnText(s));save();render()}
const gradeLetter=g=>g>=90?'A+':g>=80?'A':g>=70?'B':g>=60?'C':g>=50?'D':'F';
const avgMood=s=>NEEDS.reduce((a,[k])=>a+s.needs[k],0)/NEEDS.length;
const moodEmoji=s=>{const m=avgMood(s);return m>=75?'😄':m>=55?'🙂':m>=40?'😐':m>=25?'😟':'😫'};

function talkEntry(pid,cat,[n,fd,minF,rd,minR,special]){const a=active(),p=findPerson(pid),r=rel(a,pid);const c=TALK[cat];
 const risky=r.f<minF||(minR&&r.r<minR);
 return{icon:c.i,label:n,sub:c.mean?'Lowers friendship':risky?'⚠️ Risky — they might not like it':'Should go well',onClick:()=>doTalk(pid,cat,n,fd,minF,rd||0,minR||0,special)}}
function doTalk(pid,cat,n,fd,minF,rd,minR,special){const a=active(),p=findPerson(pid),r=rel(a,pid);closeSheet();advance(15);
 const tmod=TRAITS[p.trait]||0;let chance=.78+(r.f-Math.max(minF,0))/150+a.skills.charisma*.02+tmod;if(minR)chance+=(r.r-minR)/120;if(p.trait==='Romantic'&&rd)chance+=.1;chance=clamp(chance,.2,.97);
 const ok=TALK[cat].mean||Math.random()<chance;let msg;
 if(ok){r.f=clamp(r.f+fd*(1+a.skills.charisma/25),-100,100);r.r=clamp(r.r+rd,0,100);applyNeeds(a,{social:TALK[cat].mean?4:12,fun:3});addSkill(a,'charisma',.12);
  msg=TALK[cat].mean?`${a.name} chose to ${n.toLowerCase()} with ${p.name} 😤`:`${a.name}: "${n}" — ${p.name} loved it! 😊`;
  if(special==='partner'){a.partnerId=pid;if(!isNpc(pid))p.partnerId=a.id;msg=`❤️ ${p.name} said yes! They're now partners`}
  if(special==='propose'){if(isNpc(pid)){a.partnerId=pid;a.married=true;moveIn(p,'Partner',a);msg=`💍 ${p.name} said YES! They got married and moved in!`}else{a.partnerId=pid;p.partnerId=a.id;a.married=p.married=true;msg=`💍 ${p.name} said YES! They're married!`}}
 }else{r.f=clamp(r.f-5,-100,100);if(rd)r.r=clamp(r.r-4,0,100);applyNeeds(a,{social:3});msg=`${a.name}: "${n}" — ${p.name} wasn't into it 😬`}
 if(!isNpc(pid)&&state.family.includes(p)){const r2=rel(p,a.id);r2.f=r.f;r2.r=r.r;applyNeeds(p,{social:8})}
 log(msg);toast(msg+warnText(a));save();render()}
function moveIn(npc,role,partner){const f=famOf(npc);f.members=f.members.filter(m=>m.id!==npc.id);
 const s=newSim(npc.name,npc.g,npc.age,role);s.id=npc.id.replace(/^n/,'s');s.trait=npc.trait;
 state.family.forEach(m=>{if(m.rels[npc.id]){m.rels[s.id]=m.rels[npc.id];delete m.rels[npc.id];s.rels[m.id]={...m.rels[s.id]}}else{m.rels[s.id]={f:20,r:0};s.rels[m.id]={f:20,r:0}}});
 if(partner){partner.partnerId=s.id;s.partnerId=partner.id;s.married=partner.married=true}
 s.loc={type:'home'};state.family.push(s);if(!partner)toast(`🏡 ${s.name} moved in as a roommate!`);log(`${s.name} moved in`)}

function venueOpen(id,h=hour()){const[o,c]=VENUES[id].open;const hh=(h<o&&c>24)?h+24:h;return hh>=o&&hh<c}
function npcStatus(n){const h=hour(),d=dayNum(),dw=dowOf(d),st=stageIdx(n.age);
 if(h>=23||h<7)return'home';if(st<=1)return'home';
 if((st===2||st===3)&&dw<5&&h>=8&&h<15)return'school';
 if(n.works&&dw<5&&h>=9&&h<17)return'work';
 if(hash(n.id+':'+d+':'+h)<.42){const vs=WORLDS[n.wid].venues.filter(v=>venueOpen(v)&&!VENUES[v].shop&&(!VENUES[v].adult||st>=4));if(vs.length)return'out:'+vs[Math.floor(hash(n.id+'v'+d+':'+h)*vs.length)]}
 return'home'}
function peopleAt(vid){return state.worlds[state.world].fams.flatMap(f=>f.members).filter(n=>npcStatus(n)==='out:'+vid)}
function goTo(loc,label){const s=active();if(stg(s)<=1){toast('Babies & toddlers need an adult to take them places');return}closeSheet();advance(20);s.loc=loc;tab='home';log(`${s.name} went to ${label}`);save();render();window.scrollTo(0,0)}
function goHome(){const s=active();closeSheet();advance(20);s.loc={type:'home'};tab='home';save();render()}
function knock(fid){const s=active();const f=state.worlds[state.world].fams.find(x=>x.id===fid);closeSheet();advance(20);
 const home=f.members.filter(m=>npcStatus(m)==='home');
 if(!home.length){toast(`🚪 No one answered at the ${f.last} house — nobody's home`);log(`${s.name} knocked at the ${f.last} house — no answer`);save();render();return}
 const best=Math.max(...home.map(m=>rel(s,m.id).f));const h=hour();let ch=best>=40?.95:best>=15?.7:.3;if(h>=22||h<8)ch*=.25;
 if(Math.random()<ch){s.loc={type:'visit',fid};home.forEach(m=>{const r=rel(s,m.id);r.f=clamp(r.f+3,-100,100)});tab='home';const m=`${home[0].name} ${home[0].last} welcomed ${s.name} inside 🏡`;log(m);toast(m)}
 else{const why=best<15?"they don't really know you":(h>=22||h<8)?"it's too late for visitors":'they\'re busy right now';const m=`🚪 The ${f.last}s turned ${s.name} away — ${why}`;log(m);toast(m)}
 save();render()}

 state.hotel=hid?makeHouse(HOTELS[hid],{wid,hid}):null;state.family.forEach(s=>s.loc={type:'home'});tab='home';
 const m=hid?`✈️ The family arrived in ${WORLDS[wid].n} and checked into ${HOTELS[hid].n}!`:`🏠 Back home in ${WORLDS[wid].n}`;log(m);toast(m);save();render();window.scrollTo(0,0)}

/* ============ pets ============ */
const PETS={dog:{n:'Dog',i:'🐕',fee:150,walk:1,tricks:['Sit','Shake paw','Roll over','Play dead','Fetch the newspaper']},cat:{n:'Cat',i:'🐈',fee:100,hatesBath:1,tricks:['High five','Come when called','Jump through a hoop']},bunny:{n:'Bunny',i:'🐇',fee:60,tricks:['Spin in a circle','Hop over a stick']},hamster:{n:'Hamster',i:'🐹',fee:30,tricks:['Run the maze']},parrot:{n:'Parrot',i:'🦜',fee:200,tricks:['Say hello','Whistle a tune','Say your name','Wave a wing']}};
const PNEEDS=[['hunger','🦴','Hunger'],['energy','⚡','Energy'],['fun','🎾','Fun'],['hygiene','🛁','Clean'],['bladder','🌳','Potty'],['love','❤️','Love']];
const PDECAY={hunger:4,energy:3,fun:5,hygiene:2,bladder:6,love:3};
const PTRAITS={Playful:{fun:1.3},Lazy:{energy:.7,fun:.8},Cuddly:{love:1.4},Independent:{love:.6},Foodie:{hunger:1.3},Hyper:{energy:1.3,fun:1.2}};
const PET_NAMES=['Biscuit','Luna','Max','Pepper','Mochi','Rocky','Daisy','Nugget','Oreo','Cooper','Willow','Ziggy','Peanut','Coco','Bear','Pickles','Kiwi','Sunny','Waffles','Bean'];
const petNeeds=p=>PNEEDS.filter(([k])=>k!=='bladder'||p.sp==='dog');
const petAvg=p=>{const n=petNeeds(p);return n.reduce((a,[k])=>a+p.needs[k],0)/n.length};
const petMood=p=>{const m=petAvg(p);return m>=70?'😊':m>=45?'😐':m>=25?'😟':'😿'};
const bondLabel=b=>b>=80?'Best friends 💖':b>=50?'Buddies':b>=20?'Getting along':'New pet';
const homeItems=t=>state.home?state.home.rooms.flatMap(r=>r.items.filter(it=>ITEMS[it.id].type===t)):[];
const petsAway=()=>state.world!==state.homeWorld;
const atOwnHome=s=>s.loc.type==='home'&&!petsAway()&&!!state.home;
function applyP(p,n){for(const k in n)if(p.needs[k]!==undefined)p.needs[k]=clamp(p.needs[k]+n[k],0,100)}
function petDecay(step){state.pets.forEach(p=>{if(petsAway()){petNeeds(p).forEach(([k])=>p.needs[k]=Math.max(p.needs[k],60));return}
 const tm=PTRAITS[p.trait]||{};petNeeds(p).forEach(([k])=>{p.needs[k]=clamp(p.needs[k]-PDECAY[k]*(tm[k]||1)*step/60,0,100)});
 const beds=homeItems('petbed');if(p.needs.energy<25&&beds.length)p.needs.energy=70+Math.max(...beds.map(b=>ITEMS[b.id].tier))*8;
 if(p.needs.hunger<25&&homeItems('bowl').some(b=>ITEMS[b.id].tier>=2)&&state.money>=2){p.needs.hunger=80;state.money-=2}
 if(p.needs.fun<25&&homeItems('pettoy').some(t=>ITEMS[t.id].for.includes(p.sp)))p.needs.fun=55;
 if(p.sp==='dog'&&p.needs.bladder<=0){p.needs.bladder=70;p.bond=clamp(p.bond-3,0,100);log(`💩 ${p.name} had an accident inside! Walk your dog more often.`)}})}
function petActs(pid){const p=state.pets.find(x=>x.id===pid);const S=PETS[p.sp];const R0=()=>atOwnHome(active());const why='Be at home with your pet';
 const bump=(x,b)=>{p.bond=clamp(p.bond+b*(1+x.skills.charisma/30),0,100)};

 out.push(...buildList([`Inventory (${state.inv.length})`].concat(state.inv.length?state.inv.map(it=>({icon:ITEMS[it.id].i,label:ITEMS[it.id].n,sub:own?'Tap to place or sell':'Place it when you get home',right:own?'›':'',onClick:()=>own&&pushMenu(ITEMS[it.id].n,ownedItemMenu(it,null))})):[el('div',{class:'card mut'},'Empty. Buy things with "→ inventory" or pick up souvenirs on vacation.')])));

function renderFamily(){const out=[el('h1',{},`The ${state.familyName} family`)];
 state.family.forEach(s=>{const j=s.job&&jobById(s.job.id);const st=stg(s);
  out.push(el('div',{class:'card'},
   el('div',{style:'display:flex;gap:10px;align-items:center'},el('div',{style:'font-size:36px'},avatar(s)),el('div',{style:'flex:1'},el('div',{style:'font-weight:900;font-size:16px'},s.name+(s.id===state.activeId?' ⭐':'')),el('div',{class:'mut'},`${stageName(s.age)} · age ${s.age} · ${s.role}${s.partnerId?` · ${s.married?'married to':'dating'} ${(findPerson(s.partnerId)||{}).name||'someone'}`:''}`)),el('div',{style:'font-size:24px'},moodEmoji(s))),
   el('div',{style:'margin:6px 0'},j?el('span',{class:'pill b'},`${j.i} ${j.lv[s.job.level][0]} · ${fmt$(j.lv[s.job.level][1])}/h · perf ${Math.round(s.job.perf)}%`):st>=3?el('span',{class:'pill o'},'No job'):null,(st===2||st===3)?el('span',{class:'pill'},`🎒 Grade ${gradeLetter(s.grade)}`):null,s.loc.type!=='home'?el('span',{class:'pill o'},`📍 Out`):null),
   needBars(s,true),
   el('div',{class:'skills',style:'margin-top:8px'},SKILLS.map(([k,i,n])=>el('span',{class:'pill'},`${i} ${n} ${Math.floor(s.skills[k])}`))),
   el('div',{class:'grid2',style:'margin-top:8px'},el('button',{class:'btn ghost',onclick:()=>{state.activeId=s.id;tab='home';save();render()}},'🎮 Control'),el('button',{class:'btn gray',onclick:()=>pushMenu(s.name,simDetails(s.id))},'⋯ More'))))});
 if(state.pets.length){out.push(el('div',{class:'sec'},'Pets'));state.pets.forEach(p=>{const S=PETS[p.sp];out.push(el('div',{class:'card',onclick:()=>pushMenu(p.name,petSheet(p.id)),style:'cursor:pointer'},el('div',{style:'display:flex;gap:10px;align-items:center;margin-bottom:6px'},el('div',{style:'font-size:36px'},S.i),el('div',{style:'flex:1'},el('div',{style:'font-weight:900;font-size:16px'},p.name),el('div',{class:'mut'},`${S.n} · ${p.trait} · ${bondLabel(p.bond)}${p.tricks.length?` · ${p.tricks.length} tricks`:''}`)),el('div',{style:'font-size:24px'},petMood(p))),petBars(p)))})}
 return el('div',{},out)}
function simDetails(id){return()=>{const s=state.family.find(x=>x.id===id);if(!s)return[];const st=stg(s);const out=[];
 out.push('Career');
 if(s.job){const j=jobById(s.job.id);out.push({icon:j.i,label:j.lv[s.job.level][0],sub:`${j.n} · ${fmtH(j.start)}, ${j.hours}h · ${j.days.map(d=>DAYS[d]).join(' ')} · needs ${SKILLS.find(x=>x[0]===j.skill)[2]} to advance`});out.push({icon:'🚪',label:'Quit job',onClick:()=>{s.job=null;log(`${s.name} quit their job`);save();refreshSheet();render()}})}
 if(st>=3)out.push({icon:'📋',label:s.job?'Switch jobs':'Find a job',right:'›',onClick:()=>pushMenu('Job board',jobBoard(id))});
 else out.push(el('div',{class:'card mut'},st<=1?'Too young for school or work.':'Kids go to school on weekdays (8 AM–3 PM).'));
 out.push('Profile');out.push({icon:'✏️',label:'Rename',right:'›',onClick:()=>pushMenu('Rename',()=>[inputCard('New name',s.name,v=>{s.name=v;save();sheetStack.pop();refreshSheet();render()})])});
 const rels=Object.entries(s.rels).filter(([pid,r])=>findPerson(pid)&&(Math.abs(r.f)>=5||r.r>0)).sort((a,b)=>b[1].f-a[1].f);
 out.push(`Relationships (${rels.length})`);if(!rels.length)out.push(el('div',{class:'card mut'},'No relationships yet. Go meet people!'));
 rels.forEach(([pid,r])=>{const p=findPerson(pid);out.push({icon:avatar(p),label:`${p.name} ${p.last||''}`,sub:`${relLabel(r,pid,s)} · ❤️ ${Math.round(r.f)}${r.r?` · 💘 ${Math.round(r.r)}`:''}`})});
 return out}}
function jobBoard(id){return()=>{const s=state.family.find(x=>x.id===id);const teen=stg(s)===3;return[teen?el('div',{class:'card mut'},'Teens can take part-time jobs (marked ✅).'):null].concat(JOBS.map(j=>{const ok=!teen||j.teen;return{icon:j.i,label:`${j.n} — ${j.lv[0][0]}`,sub:`${fmt$(j.lv[0][1])}/h · ${fmtH(j.start)} for ${j.hours}h · ${j.days.map(d=>DAYS[d][0]+DAYS[d][1]).join(' ')} · top: ${j.lv[3][0]} ${fmt$(j.lv[3][1])}/h${teen&&j.teen?' ✅':''}`,disabled:!ok,onClick:()=>{s.job={id:j.id,level:0,perf:0};const m=`💼 ${s.name} got a job as a ${j.lv[0][0]}!`;log(m);toast(m);save();closeSheet();render()}}}))}}

function travelMenu(){const out=[];const n=state.family.length;
 Object.entries(WORLDS).forEach(([wid,W])=>{if(wid===state.world)return;const cost=routeCost(state.world,wid)*n;
  if(wid===state.homeWorld)out.push({icon:W.i,label:`Go home to ${W.n}`,sub:`Travel ${fmt$(cost)} for ${n}`,onClick:()=>travelTo(wid,null)});
  else out.push({icon:W.i,label:W.n,sub:`${W.desc} · travel ${fmt$(cost)} for ${n}`,right:'›',onClick:()=>pushMenu(W.n,()=>['Choose a hotel to check in'].concat(W.hotels.map(h=>{const H=HOTELS[h];const tot=cost+H.night;return{icon:'🏨',label:H.n,sub:`${fmt$(H.night)}/night · ${H.rooms.flatMap(r=>r[2]).map(i=>ITEMS[i].i).join('')} · total today ${fmt$(tot)}`,disabled:state.money<tot,onClick:()=>travelTo(wid,h)}})))})});
 return[el('div',{class:'card mut'},`You're in ${WORLDS[state.world].n}. Trips take 3 hours, the whole family comes along, and hotels charge nightly.`)].concat(out)}
function renderMore(){return el('div',{},
 ...buildList(['Explore',{icon:'✈️',label:'Travel & vacations',sub:'Other worlds, hotels',right:'›',onClick:()=>pushMenu('Travel',travelMenu)},
  'Household',{icon:'💵',label:'Money',sub:`Weekly bills on Mondays ≈ ${fmt$(Math.round(homeValue()*.012+itemsValue()*.01))}`,right:fmt$(state.money)},{icon:'📔',label:'Family diary',sub:'Everything that happened',right:'›',onClick:()=>pushMenu('Diary',()=>[el('div',{class:'card'},state.log.length?state.log.map(l=>el('div',{class:'logline'},el('b',{},l.t),l.m)):el('div',{class:'mut'},'Nothing yet.'))])},
  'Game',{icon:'❓',label:'How to play',right:'›',onClick:()=>pushMenu('How to play',howTo)},{icon:'🔄',label:'Start a new game',sub:'Erases this family',onClick:()=>pushMenu('New game?',()=>[confirmCard('Start over? This family and their home will be gone for good.','Start a new game',()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}state=null;draft=null;tab='home';closeSheet();render()},true)])}]),
 el('div',{class:'mut center',style:'margin-top:14px'},'Progress saves automatically in this browser.'))}
function howTo(){return[el('div',{class:'card',html:`<p><b>Needs</b> drop over time. Keep them up by doing things — tap <b>▶ Actions</b> or your character's picture for a list sorted by room.</p><p><b>Time</b> only moves when you do something. Every action takes minutes or hours.</p><p><b>Rooms</b>: tap a room on the Home tab to use what's in it, or rename it (e.g. "Mia's Room").</p><p><b>Build mode</b>: buy furniture & upgrades (⭐⭐⭐ = better), place them in any room, sell old stuff for half price, or build new rooms.</p><p><b>Work</b>: get a job in the Family tab. Go to work during the shift window. Good mood + skills = promotions. Skipping work hurts performance.</p><p><b>Map</b>: visit places, meet people, tap someone to talk. Knock on neighbors' doors — strangers may turn you away, and nobody answers if they're out.</p><p><b>Romance</b>: adults can flirt, become partners, propose (they move in!) and try for a baby in a bed.</p><p><b>Ages</b>: everyone has a birthday every 7 days. Babies need an adult to feed, bathe and put them to bed in a crib.</p><p><b>Vacations</b>: travel from the More tab, check into a hotel, buy souvenirs for your inventory.</p><p><b>Pets</b>: buy a pet bed (Build → Pets), then adopt a dog, cat, bunny, hamster or parrot at the pet shelter on the Map. Pets have needs: feed, cuddle, bathe and play with them, walk your dog, teach tricks, and buy toys. A neglected pet gets taken back to the shelter. While you travel, a pet sitter looks after them for $15 a night.</p><p><b>Bills</b> are due every Monday.</p>`})]}

function renderCreate(){if(!draft)draft={last:'',members:[{name:'',g:'f',stage:4,role:'Head'}]};

  wrap.append(el('div',{class:'card'},el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'},el('b',{},`${AV[m.g][m.stage]} Member ${i+1}`),i>0?el('button',{class:'btn red',style:'padding:5px 10px',onclick:()=>{draft.members.splice(i,1);render()}},'Remove'):null),

   el('div',{class:'mrow'},sel([['f','Female'],['m','Male'],['x','Nonbinary']],m.g,v=>{m.g=v;render()}),sel(STAGES.map((s,k)=>[k,s[0]]),m.stage,v=>{m.stage=+v;render()})),
   i>0?el('div',{class:'mrow',style:'grid-template-columns:1fr'},sel([['Partner','Partner of member 1'],['Child','Child'],['Sibling','Sibling'],['Parent','Parent'],['Roommate','Roommate']],m.role,v=>m.role=v)):el('div',{class:'mut',style:'margin-top:6px'},'Head of household')))});
 if(draft.members.length<6)wrap.append(el('button',{class:'btn gray full',onclick:()=>{draft.members.push({name:'',g:R(['f','m']),stage:2,role:'Child'});render()}},'＋ Add family member'));
 wrap.append(el('div',{style:'height:10px'}),el('button',{class:'btn full',onclick:startGame},'Continue → choose a home'));

function startGame(){const d=draft;if(!d.last.trim()){toast('Give your family a last name');return}if(d.members.some(m=>!m.name.trim())){toast('Every member needs a first name');return}
 if(!d.members.some(m=>m.stage>=4)){toast('You need at least one young adult or older');return}
 if(d.members.filter(m=>m.role==='Partner').length>1){toast('Only one partner allowed');return}
 const fam=d.members.map((m,i)=>newSim(m.name.trim(),m.g,STAGE_START[m.stage]+Math.floor(Math.random()*2),i===0?'Head':m.role));
 fam.forEach(a=>fam.forEach(b=>{if(a!==b){const close=(a.role==='Child'||b.role==='Child'||a.role==='Parent'||b.role==='Parent');a.rels[b.id]={f:close?70:50,r:0}}}));
 const head=fam[0],p=fam.find(x=>x.role==='Partner');if(p){head.partnerId=p.id;p.partnerId=head.id;head.married=p.married=true;head.rels[p.id]={f:80,r:80};p.rels[head.id]={f:80,r:80}}
 const used=new Set([d.last.trim()]);const worlds={};Object.keys(WORLDS).forEach(w=>worlds[w]=genWorld(w,used));
 state={v:1,pets:[],familyName:d.last.trim(),family:fam,activeId:fam[0].id,money:30000,time:480,world:'willow',homeWorld:'willow',home:null,hotel:null,inv:[],worlds,log:[]};
 render();window.scrollTo(0,0)}
